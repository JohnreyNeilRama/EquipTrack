<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" role="img" aria-label="Illustration of a ceiling projector, a laptop showing an equipment dashboard and a toolbox on a campus equipment desk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eefa"/>
      <stop offset="1" stop-color="#c3d5ee"/>
